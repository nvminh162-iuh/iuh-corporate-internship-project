# ==============================================================================
# TeleCare Platform - Staging Application Deployment Compose
# Deployment Target: AWS EC2 Staging Environment
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. TeleCare Backend Monolith (Spring Boot 4 / Java 21)
  # ----------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-telecare-backend}:${IMAGE_TAG:-staging}
    container_name: telecare-backend-staging
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 55080
      SERVER_SERVLET_CONTEXT_PATH: /api/v1
      
      # Database connection (internal Docker network DNS)
      DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-telecare}
      DATASOURCE_USERNAME: ${DB_USERNAME:-telecare}
      DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: validate

      # Redis Cache
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Kafka Broker
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST:-kafka}:${KAFKA_PORT:-19092}

      # Keycloak IAM
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-telecare}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_CURRENT_REALM: telecare-platform
      KEYCLOAK_CLIENT_ID: telecare-id

      # AWS S3 Storage (from EC2 instance metadata or IAM role preferred)
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-telecare-staging-files}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # Production Security & Docs
      BOOTSTRAP_ADMIN_ENABLED: "false"
      SWAGGER_ENABLED: "false"
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_APP: ${LOGGING_LEVEL_APP:-INFO}

    ports:
      - "${BACKEND_PORT:-55080}:55080"
    networks:
      - telecare-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:55080/api/v1/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 2. TeleCare Admin Portal (Vite + React SPA served via Nginx)
  # ----------------------------------------------------------------------------
  admin-portal:
    image: ${ADMIN_PORTAL_IMAGE:-telecare-admin-portal}:${IMAGE_TAG:-staging}
    container_name: telecare-admin-portal-staging
    restart: unless-stopped
    ports:
      - "${ADMIN_PORTAL_PORT:-55000}:80"
    networks:
      - telecare-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 3. TeleCare Customer Web App (Next.js 16 Standalone)
  # ----------------------------------------------------------------------------
  web-app:
    image: ${WEB_APP_IMAGE:-telecare-web-app}:${IMAGE_TAG:-staging}
    container_name: telecare-web-app-staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 53000
    ports:
      - "${WEB_APP_PORT:-53000}:53000"
    networks:
      - telecare-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:53000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  telecare-network:
    name: telecare-network
    external: true
