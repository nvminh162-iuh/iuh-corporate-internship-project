services:
    #  =================================================================
    #  pgAdmin
    #  =================================================================
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: telecare-pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-telecare.platform.cskh@gmail.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-telecare123}
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
        ports:
            - '55050:80'
        volumes:
            - telecare-pgadmin-data:/var/lib/pgadmin
            - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
        networks:
            - telecare-network

    #  =================================================================
    #  RedisInsight
    #  =================================================================
    redis-insight:
        image: redis/redisinsight:latest
        container_name: telecare-redis-insight
        restart: unless-stopped
        ports:
            - '55540:5540'
        volumes:
            - telecare-redis-insight-data:/data
        networks:
            - telecare-network

    #  =================================================================
    #  Kafka UI
    #  =================================================================
    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: telecare-kafka-ui
        restart: unless-stopped
        ports:
            - '59022:9022'
        environment:
            SERVER_PORT: 9022
            KAFKA_CLUSTERS_0_NAME: Telecare
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
        networks:
            - telecare-network

volumes:
    telecare-pgadmin-data:
        name: telecare-pgadmin-data
    telecare-redis-insight-data:
        name: telecare-redis-insight-data

networks:
    telecare-network:
        name: telecare-network
        external: true

#  =================================================================
#  Usage
#  =================================================================
#  Start infrastructure first:
#    docker compose -f docker-infrastructure.yml up -d
#
#  Start observability tools:
#    docker compose -f docker-observability.yml up -d
#
#  Stop observability tools:
#    docker compose -f docker-observability.yml down
#
#  pgAdmin:
#    URL: http://localhost:55050
#    Login email: telecare.platform.cskh@gmail.com
#    Login password: telecare123
#    PostgreSQL host: postgres
#    PostgreSQL port: 5432
#    PostgreSQL database: keycloak
#    PostgreSQL username: telecare
#    PostgreSQL password: telecare123
#
#  RedisInsight:
#    URL: http://localhost:55540
#
#  Kafka UI:
#    URL: http://localhost:59022
#    Kafka bootstrap server from Docker network: kafka:19092
#
#  Connect RedisInsight to Redis from Docker network:
#    Host: redis
#    Port: 6379
#    Username: leave empty
#    Password: telecare123
#
#  Connect to Redis from an app running on local machine:
#    Host: localhost
#    Port: 56379
#    Username: leave empty
#    Password: telecare123
