# Paste this entire file into Dokploy > telecare-infrastructure > General > Raw.
# Set variables in that Compose service's Environment tab before deploying.
# This is a single-EC2 staging configuration, not a highly available cluster.
# No custom CPU/RAM/heap limits: service images use their own defaults.
# Admin UI host ports bind to loopback only; access them through an SSH tunnel.
x-logging: &service-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set and non-empty}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set and non-empty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      dokploy-network:
        aliases:
          - telecare-staging-postgres
    healthcheck:
      # TCP avoids reporting healthy during the temporary initialization server.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *service-logging

  # No bind-mounted SQL files are required when using Dokploy's Raw provider.
  # This idempotent, one-shot job creates the backend database if absent.
  postgres-init:
    image: postgres:16-alpine
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: telecare-staging-postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set and non-empty}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}
      PGDATABASE: postgres
    command:
      - /bin/sh
      - -ec
      - |
        psql --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE DATABASE telecare'
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'telecare')
        \gexec
        SQL
        printf 'Backend database initialization completed.\n'
    networks:
      - dokploy-network
    logging: *service-logging

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set and non-empty}
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://telecare-staging-kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@telecare-staging-kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      dokploy-network:
        aliases:
          - telecare-staging-kafka
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    logging: *service-logging

  keycloak:
    image: ${KEYCLOAK_IMAGE:?KEYCLOAK_IMAGE must be set and non-empty}
    pull_policy: always
    restart: unless-stopped
    command: ['start', '--optimized', '--import-realm']
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://telecare-staging-postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set and non-empty}
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set and non-empty}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME must be set and non-empty}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set and non-empty}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME must be set and non-empty}
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KAFKA_BOOTSTRAP_SERVER: telecare-staging-kafka:19092
      KEYCLOAK_KAFKA_TOPIC: ${KEYCLOAK_KAFKA_TOPIC:?KEYCLOAK_KAFKA_TOPIC must be set and non-empty}
    expose:
      - '8080'
    networks:
      dokploy-network:
        aliases:
          - telecare-staging-keycloak
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    logging: *service-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    networks:
      dokploy-network:
        aliases:
          - telecare-staging-redis
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *service-logging

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL must be set and non-empty}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set and non-empty}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      # True manages the connection list from JSON, including existing pgAdmin volumes.
      # It replaces pgAdmin server registrations only, never PostgreSQL databases.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: ${PGADMIN_REPLACE_SERVERS_ON_STARTUP:?PGADMIN_REPLACE_SERVERS_ON_STARTUP must be set and non-empty}
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    ports:
      - '127.0.0.1:55050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      dokploy-network:
        aliases:
          - telecare-staging-pgadmin
    logging: *service-logging

  redis-insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:55540:5540'
    volumes:
      - redis-insight-data:/data
    networks:
      dokploy-network:
        aliases:
          - telecare-staging-redis-insight
    logging: *service-logging

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: '9022'
      KAFKA_CLUSTERS_0_NAME: Telecare
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: telecare-staging-kafka:19092
    ports:
      - '127.0.0.1:59022:9022'
    networks:
      dokploy-network:
        aliases:
          - telecare-staging-kafka-ui
    logging: *service-logging

# Inline content works with Dokploy Raw: no repository checkout or host file needed.
# Credentials are deliberately excluded; enter POSTGRES_PASSWORD when connecting.
configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "${PGADMIN_SERVER_NAME:?PGADMIN_SERVER_NAME must be set and non-empty}",
            "Group": "${PGADMIN_SERVER_GROUP:?PGADMIN_SERVER_GROUP must be set and non-empty}",
            "Host": "${PGADMIN_SERVER_HOST:?PGADMIN_SERVER_HOST must be set and non-empty}",
            "Port": ${PGADMIN_SERVER_PORT:?PGADMIN_SERVER_PORT must be set and non-empty},
            "MaintenanceDB": "${POSTGRES_DB:?POSTGRES_DB must be set and non-empty}",
            "Username": "${POSTGRES_USER:?POSTGRES_USER must be set and non-empty}",
            "SSLMode": "${PGADMIN_SERVER_SSL_MODE:?PGADMIN_SERVER_SSL_MODE must be set and non-empty}"
          }
        }
      }

volumes:
  postgres-data:
    name: telecare-staging-postgres-data
  kafka-data:
    name: telecare-staging-kafka-data
  redis-data:
    name: telecare-staging-redis-data
  pgadmin-data:
    name: telecare-staging-pgadmin-data
  redis-insight-data:
    name: telecare-staging-redis-insight-data

networks:
  dokploy-network:
    name: dokploy-network
    external: true
