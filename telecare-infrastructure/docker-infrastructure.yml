services:
    #  =================================================================
    #  PostgreSQL
    #  =================================================================
    postgres:
        image: postgres:16-alpine
        container_name: telecare-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-keycloak}
            POSTGRES_USER: ${POSTGRES_USER:-telecare}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telecare123}
        ports:
            - '55432:5432'
        volumes:
            - telecare-postgres-data:/var/lib/postgresql/data
            - ./postgres/init:/docker-entrypoint-initdb.d:ro
        networks:
            - telecare-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 10s
            timeout: 5s
            retries: 5

    #  =================================================================
    #  Redis
    #  =================================================================
    redis:
        image: redis:7-alpine
        container_name: telecare-redis
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-telecare123}
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-telecare123}
        ports:
            - '56379:6379'
        volumes:
            - telecare-redis-data:/data
        networks:
            - telecare-network
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
            interval: 10s
            timeout: 5s
            retries: 5

    #  =================================================================
    #  Kafka
    #  =================================================================
    kafka:
        image: apache/kafka:latest
        container_name: telecare-kafka
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        ports:
            - '59092:9092'
        environment:
            # [Tổng quan]
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            # [Listener]
            # INTERNAL: container trong Docker kết nối qua kafka:19092
            # EXTERNAL: app trên máy host kết nối qua localhost:59092
            # CONTROLLER: cổng quản lý metadata
            KAFKA_LISTENERS: 'INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093'
            KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:19092,EXTERNAL://localhost:59092'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            # [Controller/Quorum]
            # Local 1 node: id=1, địa chỉ kafka:9093.
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
            # [Replication/Partition]
            # Local để 1 để khởi động nhanh, ít tốn tài nguyên.
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
        volumes:
            - telecare-kafka-data:/var/lib/kafka/data
        networks:
            - telecare-network

    #  =================================================================
    #  Keycloak
    #  =================================================================
    keycloak:
        image: quay.io/keycloak/keycloak:26.5.2
        container_name: telecare-keycloak
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 750M
        command: start --import-realm
        volumes:
            - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
            - ./keycloak/provider:/opt/keycloak/providers
            - ./keycloak/keycloak-themes:/opt/keycloak/themes:ro
        healthcheck:
            test: ['CMD-SHELL', "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3\""]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 40s
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
        ports:
            - '59000:8080'
            - '59001:9000'
        environment:
            # Database
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
            KC_DB_USERNAME: ${POSTGRES_USER:-telecare}
            KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-telecare123}
            # Keycloak
            # Chỉ tạo admin ở lần khởi động đầu tiên (khi master realm chưa tồn tại).
            KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-telecare}
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-telecare123}
            # SPI Config
            KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVER:-kafka:19092}
            KEYCLOAK_KAFKA_TOPIC: ${KEYCLOAK_KAFKA_TOPIC:-keycloak-user-events}
            # Health & Metrics
            KC_HEALTH_ENABLED: 'true'
            KC_METRICS_ENABLED: 'true'
            KC_SPI_THEME_CACHE_THEMES: 'false'
            KC_SPI_THEME_CACHE_TEMPLATES: 'false'
            KC_SPI_THEME_STATIC_MAX_AGE: '-1'
            # Network
            # Keycloak 26 dùng Hostname v2 — bỏ hostname-strict-https (đã deprecate).
            KC_HTTP_ENABLED: 'true'
            KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
            KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-false}
            JAVA_OPTS_APPEND: -Xms256m -Xmx512m
        networks:
            - telecare-network

volumes:
    telecare-postgres-data:
        name: telecare-postgres-data
    telecare-redis-data:
        name: telecare-redis-data
    telecare-kafka-data:
        name: telecare-kafka-data

networks:
    telecare-network:
        name: telecare-network
        driver: bridge

#  =================================================================
#  Usage
#  =================================================================
#  Start infrastructure:
#    docker compose -f docker-infrastructure.yml up -d
#
#  Stop infrastructure:
#    docker compose -f docker-infrastructure.yml down
#
#  PostgreSQL:
#    Host in Docker: postgres
#    Host on local machine: localhost
#    Port on local machine: 55432
#    Databases: keycloak (Keycloak), telecare (monolith)
#    Username: telecare
#    Password: telecare123
#
#  Redis:
#    Host in Docker: redis
#    Host on local machine: localhost
#    Port on local machine: 56379
#    Username: leave empty
#    Password: telecare123
#
#  Kafka:
#    Bootstrap server in Docker: kafka:19092
#    Bootstrap server on local machine: localhost:59092
#
#  Keycloak:
#    URL: http://localhost:59000
#    Health: http://localhost:59001/health/ready
#    Admin username: telecare
#    Admin password: telecare123
