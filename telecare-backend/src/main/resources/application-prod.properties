# ===============================================================
# TELECARE BACKEND - PRODUCTION PROFILE
# ===============================================================
# Safe Schema Validation (Never auto-update schema in production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Strictly disable Swagger / OpenAPI docs in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Disable admin bootstrapping in production
homespace.bootstrap.admin.enabled=false

# HikariCP Connection Pool Tuning for Production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=TelecareProdHikariPool

# HTTP Response Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=2048

# Security & Observability - Do not expose internal details in health checks
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Logging configuration (clean stdout for docker collector)
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.hs.user=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
