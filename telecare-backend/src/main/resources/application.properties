# ===============================================================
# EXTERNAL CONFIGURATION
# ===============================================================
# Load .env when starting from the backend folder or workspace root.
# Dokploy can supply the same variables directly without a mounted file.
spring.config.import=optional:file:./.env[.properties][encoding=utf-8],optional:file:./telecare-backend/.env[.properties][encoding=utf-8]

# ===============================================================
# CORE APPLICATION
# ===============================================================
server.port=${SERVER_PORT}
server.servlet.context-path=${SERVER_CONTEXT_PATH}
spring.application.name=${SPRING_APPLICATION_NAME}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED}
spring.devtools.add-properties=${SPRING_DEVTOOLS_ADD_PROPERTIES}
spring.devtools.livereload.enabled=${SPRING_DEVTOOLS_LIVERELOAD_ENABLED}
spring.output.ansi.enabled=${SPRING_OUTPUT_ANSI_ENABLED}
spring.main.banner-mode=${SPRING_MAIN_BANNER_MODE}
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED}

# ===============================================================
# DATABASE / CONNECTION POOL
# ===============================================================
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}
spring.jpa.properties.hibernate.dialect=${JPA_DATABASE_DIALECT}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT}
spring.datasource.hikari.pool-name=${HIKARI_POOL_NAME}

# ===============================================================
# JSON / KAFKA
# ===============================================================
spring.jackson.date-format=${JACKSON_DATE_FORMAT}
spring.jackson.time-zone=${JACKSON_TIME_ZONE}
spring.kafka.topic.keycloak-user-events=${KEYCLOAK_USER_EVENTS_TOPIC}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET}
spring.kafka.consumer.key-deserializer=${KAFKA_KEY_DESERIALIZER}
spring.kafka.consumer.value-deserializer=${KAFKA_VALUE_DESERIALIZER}

# ===============================================================
# KEYCLOAK / AWS S3
# ===============================================================
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.admin.user-name=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.current-realm=${KEYCLOAK_CURRENT_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_CURRENT_REALM}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_CURRENT_REALM}/protocol/openid-connect/certs
aws.s3.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# ===============================================================
# BOOTSTRAP DATA
# ===============================================================
homespace.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED}
homespace.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME}
homespace.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL}
homespace.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
homespace.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME}
homespace.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME}

# ===============================================================
# HTTP / OBSERVABILITY / LOGGING
# ===============================================================
server.compression.enabled=${SERVER_COMPRESSION_ENABLED}
server.compression.mime-types=${SERVER_COMPRESSION_MIME_TYPES}
server.compression.min-response-size=${SERVER_COMPRESSION_MIN_RESPONSE_SIZE}
management.endpoints.web.exposure.include=${MANAGEMENT_WEB_EXPOSURE_INCLUDE}
management.info.env.enabled=${MANAGEMENT_INFO_ENV_ENABLED}
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES_ENABLED}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS}
management.endpoint.health.status.http-mapping.UP=${MANAGEMENT_HEALTH_UP_STATUS}
management.endpoint.health.status.http-mapping.DOWN=${MANAGEMENT_HEALTH_DOWN_STATUS}
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_ENABLED}
management.metrics.tags.application=${SPRING_APPLICATION_NAME}
management.metrics.distribution.percentiles-histogram.http.server.requests=${MANAGEMENT_HTTP_HISTOGRAM_ENABLED}
logging.level.root=${LOGGING_LEVEL_ROOT}
logging.level.com.hs.user=${LOGGING_LEVEL_APP}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY}
logging.level.org.hibernate=${LOGGING_LEVEL_HIBERNATE}

# ===============================================================
# OPENAPI / SWAGGER
# ===============================================================
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH}
springdoc.swagger-ui.operations-sorter=${SWAGGER_OPERATIONS_SORTER}
springdoc.swagger-ui.tags-sorter=${SWAGGER_TAGS_SORTER}
springdoc.api-docs.enabled=${SWAGGER_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED}
