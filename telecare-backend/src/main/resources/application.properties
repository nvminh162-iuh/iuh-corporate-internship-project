# ===============================================================
# CORE APPLICATION
# ===============================================================
server.port=58080
server.servlet.context-path=/api/v1
spring.application.name=telecare-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.output.ansi.enabled=ALWAYS
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

# ===============================================================
# INFRASTRUCTURE & DATA
# ===============================================================
## SQL
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
## JSON Format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
## Kafka
spring.kafka.topic.keycloak-user-events=keycloak-user-events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
### Keycloak
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.admin.user-name=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.current-realm=${KEYCLOAK_CURRENT_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_CURRENT_REALM}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_CURRENT_REALM}/protocol/openid-connect/certs
### AWS S3
aws.s3.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${AWS_S3_BUCKET:telecare-dev-files-v1}
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# ===============================================================
# BOOTSTRAP DATA
# ===============================================================
homespace.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED}
homespace.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME}
homespace.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL}
homespace.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
homespace.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME}
homespace.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME}

# ===============================================================
# OBSERVABILITY
# ===============================================================
## Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
## Logging
logging.level.root=${LOGGING_LEVEL_ROOT}
## Dev Tools
SPRING_DEVTOOLS_ADD_PROPERTIES=false
SPRING_DEVTOOLS_RESTART_ENABLED=false
SPRING_DEVTOOLS_LIVERELOAD_ENABLED=false