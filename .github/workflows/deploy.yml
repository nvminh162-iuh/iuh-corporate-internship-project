name: TeleCare - Build & Push Backend Image

on:
  push:
    branches:
      - master
    paths:
      - telecare-backend/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telecare-backend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: telecare-backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo '::error::Configure DOCKER_USERNAME and DOCKER_PASSWORD in GitHub repository Actions secrets.'
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven
          cache-dependency-path: telecare-backend/pom.xml

      - name: Build & Push Docker Image with Jib
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress clean compile jib:build \
            -DskipTests \
            -Djib.to.tags="$GITHUB_SHA" \
            -Djib.to.auth.username="$DOCKER_USERNAME" \
            -Djib.to.auth.password="$DOCKER_PASSWORD"
