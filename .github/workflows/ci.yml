name: TeleCare Continuous Integration (CI)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Service: Unit & Integration Tests + Compilation
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend (Spring Boot 4 / Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telecare-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Compile and Run Tests with JaCoCo Coverage
        run: ./mvnw test --no-transfer-progress

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: telecare-backend/target/surefire-reports/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 2. Admin Portal: ESLint, TypeScript & Vite Production Build
  # ----------------------------------------------------------------------------
  admin-ci:
    name: Admin Portal (Vite / React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telecare-admin-portal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: telecare-admin-portal/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Production Build
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Customer Web App: ESLint, TypeScript & Next.js Build
  # ----------------------------------------------------------------------------
  web-ci:
    name: Customer Web App (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telecare-web-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: telecare-web-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build

  # ----------------------------------------------------------------------------
  # 4. Docker Validation: Multi-stage Build Test & Compose Lint
  # ----------------------------------------------------------------------------
  docker-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validate Backend Dockerfile (Build Dry-run)
        uses: docker/build-push-action@v6
        with:
          context: ./telecare-backend
          push: false
          tags: telecare-backend:validate

      - name: Validate Admin Portal Dockerfile (Build Dry-run)
        uses: docker/build-push-action@v6
        with:
          context: ./telecare-admin-portal
          push: false
          tags: telecare-admin-portal:validate

      - name: Validate Customer Web App Dockerfile (Build Dry-run)
        uses: docker/build-push-action@v6
        with:
          context: ./telecare-web-app
          push: false
          tags: telecare-web-app:validate

      - name: Validate Docker Compose Configurations
        run: |
          docker compose -f telecare-infrastructure/docker-infrastructure.yml config > /dev/null
          docker compose -f telecare-infrastructure/docker-compose.staging.yml config > /dev/null
